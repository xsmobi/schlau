<script>

let loesungen = [];
let loesungen1 = [];

function insertObject() {

let malgeteilt = [{
	"nr": 0,
	"op1": "a",
	"op2": "b",
	"aufgabe": "Mal / Geteilt",
	"loesung": "Lösung",
  },
]
let malgeteilt_neu = { // wird überschrieben
	"nr": 0,
	"op1": " ",
	"op2": " ",
	"aufgabe": " ",
	"loesung": " ",
};

let anzahl = 60;

for (i = 1; i < anzahl + 1; i++) {
malgeteilt.push(malgeteilt_neu);
}

let min = 0;
let max = 12;
let nr = 0;
let op = "&plus;";

// Output the updated array
for (let j = 0; j < 4; j++){ // Spalten
    let k = '<tbody>';
    for (i = 1; i < malgeteilt.length; i++) {

      switch (true) {
        case i < 12 : min = 0; max = 12; break;
        case i < 31 : min = 0; max = 36;
        case i < 51 : min = -36; max = 36;
        default     : min = -100; max = 100;
      }

      malgeteilt[i].op1 = getRandomInt(max-min) + min;
      malgeteilt[i].op2 = getRandomInt(max-min) + min;

      if(malgeteilt[i].op1 === 0){
        malgeteilt[i].op1 = 1
      }
      if(malgeteilt[i].op2 === 0){
        malgeteilt[i].op2 = 1
      }
    
      let r = Math.floor(Math.random() * 3);
      switch(r) {
        case 0:
            malgeteilt[i].aufgabe = malgeteilt[i].op1 + "&nbsp;&middot;&nbsp;x&nbsp;&equals;&nbsp;" + malgeteilt[i].op2;
            malgeteilt[i].loesung = malgeteilt[i].op2 / malgeteilt[i].op1;
        break;
        case 1:
            malgeteilt[i].aufgabe ='<span class="fraction" top="&nbsp;x&nbsp;" bottom="' + malgeteilt[i].op1 + '"></span>&nbsp;&equals;&nbsp;' + malgeteilt[i].op2 + '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
            malgeteilt[i].loesung = malgeteilt[i].op2 * malgeteilt[i].op1;
        break;
        case 2:
            malgeteilt[i].aufgabe ='<span class="fraction" bottom="&nbsp;x&nbsp;" top="' + malgeteilt[i].op1 + '"></span>&nbsp;&equals;&nbsp;' + malgeteilt[i].op2 + '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';//
            malgeteilt[i].loesung = malgeteilt[i].op1 / malgeteilt[i].op2;
            wert = malgeteilt[i].op1/malgeteilt[i].op2
        break;
      }
      if (parseInt(malgeteilt[i].loesung) !== malgeteilt[i].loesung) {
        malgeteilt[i].loesung = malgeteilt[i].loesung.toFixed(2);
      }

      loesungen[i] = malgeteilt[i].loesung;


      k += '<tr>';
      k += '<td class="nr">' + malgeteilt[i].nr + '</td>';
      //k += '<td>' + malgeteilt[i].op1 + '</td>';
      //k += '<td>' + malgeteilt[i].op2 + '</td>';
      k += '<td class="aufgabe">' + malgeteilt[i].aufgabe + '</td>';
      //k += '<td>' + malgeteilt[i].loesung + '</td>'; // ausblenden!*********************
      // k += '<td>&nbsp;</td>';
      k += '</tr>';
      malgeteilt[i].nr ++;

    }
    k += '</tbody>';
    switch (j) {
      case 0 : 
        document.getElementById('tableData1').innerHTML = k;
        loesungen1 = loesungen;
        //console.log("table nr " + j)
        //console.log("loesungen 1 " + loesungen1);
        for (n = 1; n < loesungen1.length; n++) {
          m = n - 1;
          document.getElementById('loesungen1').innerHTML += "<b>" + m + "</b>: " + loesungen1[n] + "; ";
        }
        break;
      case 1 :
        document.getElementById('tableData2').innerHTML = k;
        loesungen2 = loesungen;
        //console.log("table nr " + j)
        //console.log("loesungen 2 " + loesungen2);
        for (n = 1; n < loesungen2.length; n++) {
          m = n + anzahl - 1;
          document.getElementById('loesungen2').innerHTML += "<b>" + m + "</b>: " + loesungen2[n] + "; ";
        }
        break;
      case 2 :
        document.getElementById('tableData3').innerHTML = k;
        loesungen3 = loesungen;
        //console.log("table nr " + j)
        //console.log(loesungen3);
        for (n = 1; n < loesungen3.length; n++) {
        m = n + 2*anzahl - 1;
        document.getElementById('loesungen3').innerHTML += "<b>" + m + "</b>: " + loesungen3[n] + "; ";

        //console.log(loesungen4);
        for (n = 1; n < loesungen4.length; n++) {
          m = n + 3*anzahl- 1;
          document.getElementById('loesungen4').innerHTML += "<b>" + m + "</b>: " + loesungen4[n] + "; ";
        }
        break;
      default: console.log("keine Tabelle")
    }

  } // Spalten
}

insertObject();



function getRandomInt(max) { 
  return Math.floor(Math.random() * max); // +n die Null ausschl.
  console.log(Math.floor(Math.random()));
}

function getlowestfraction(x0) {
    var eps = 1.0E-15;
    var h, h1, h2, k, k1, k2, a, x;

    x = x0;
    a = Math.floor(x);
    h1 = 1;
    k1 = 0;
    h = a;
    k = 1;

    while (x-a > eps*k*k) {
        x = 1/(x-a);
        a = Math.floor(x);
        h2 = h1; h1 = h;
        k2 = k1; k1 = k;
        h = h2 + a*h1;
        k = k2 + a*k1;
    }

    return h + "/" + k;
}
