<script>

let loesungen = [];
let loesungen1 = [];
let loesungen2 = [];
let loesungen3 = [];
let loesungen4 = [];

function insertObject() {

let brueche = [{
	"nr": 0,
	"zaehler": "Zähler",
	"nenner": "Nenner",
	"bruch_aufgabe": "Bruch kürzen",
	"bruch_loesung": "Lösung",
  },
]
let bruch_neu = { // wird überschrieben
  "nr": "0",
  "zaehler": 0,
  "nenner": 0,
  "bruch_aufgabe": " ",
  "bruch_loesung": " ",
};

let anzahl = 60;

for (i = 1; i < anzahl+1; i++) {
brueche.push(bruch_neu);
}


let quotient = 0;
let zae = 30;
let nen = 10;
let nr = 0;

// Output the updated array
// console.log(brueche);
for (let j = 0; j < 4; j++){ // Spalten
    let k = '<tbody>';
    for (i = 1; i < brueche.length; i++) {

      switch (true) {
        case i < 12 : zae = 12; nen = 10; break;
        case i < 31 : zae = 20; nen = 20;
        case i < 11 : zae = 30; nen = 30;
        default     : zae = 40; nen = 40;
      }

      brueche[i].zaehler = getRandomInt(zae, 2);
      brueche[i].nenner = getRandomInt(nen, 2);
      brueche[i].bruch_aufgabe ='<span class="fraction" top="' + brueche[i].zaehler + '" bottom="' + brueche[i].nenner + '"></span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
      quotient = brueche[i].zaehler / brueche[i].nenner;
      if (parseInt(quotient) == quotient) {
        brueche[i].bruch_loesung = quotient;
        loesungen[i] = quotient;
      } else {
        brueche[i].bruch_loesung = getlowestfraction(quotient);
        loesungen[i] = getlowestfraction(quotient);
      }

      k += '<tr>';
      k += '<td class="nr">' + brueche[i].nr + '</td>';
      //k += '<td>' + brueche[i].zaehler + '</td>';
      //k += '<td>' + brueche[i].nenner + '</td>';
      k += '<td class="aufgabe">' + brueche[i].bruch_aufgabe + '</td>';
      // k += '<td>' + brueche[i].bruch_loesung + '</td>'; Lösung ausgeblendet
      // k += '<td>&nbsp;</td>';
      k += '</tr>';
      brueche[i].nr ++;

    }
    k += '</tbody>';
    switch (j) {
      case 0 : 
        document.getElementById('tableData1').innerHTML = k;
        loesungen1 = loesungen;
        //console.log("table nr " + j)
        //console.log(loesungen1);
        for (n = 1; n < loesungen1.length; n++) {
          m = n - 1
          document.getElementById('loesungen1').innerHTML += "<b>" + m + "</b>: " + loesungen1[n] + "; ";
        }
        break;
      case 1 :
        document.getElementById('tableData2').innerHTML = k;
        loesungen2 = loesungen;
        //console.log("table nr " + j)
        //console.log(loesungen2);
        for (n = 1; n < loesungen2.length; n++) {
          m = n + anzahl - 1;
          document.getElementById('loesungen2').innerHTML += "<b>" + m + "</b>: " + loesungen2[n] + "; ";
        }
        break;
      case 2 :
        document.getElementById('tableData3').innerHTML = k;
        loesungen3 = loesungen;
        //console.log("table nr " + j)
        //console.log(loesungen3);
        for (n = 1; n < loesungen3.length; n++) {
          m = n + 2*anzahl - 1;
          document.getElementById('loesungen3').innerHTML += "<b>" + m + "</b>: " + loesungen3[n] + "; ";
        }
        break;
      case 3 :
        document.getElementById('tableData4').innerHTML = k;
        loesungen4 = loesungen;
        //console.log("table nr " + j)
        //console.log(loesungen4);
        for (n = 1; n < loesungen4.length; n++) {
          m = n + 3*anzahl - 1;
          document.getElementById('loesungen4').innerHTML += "<b>" + m + "</b>: " + loesungen4[n] + "; ";
        }
        break;
      default: console.log("keine Tabelle")
    }

  } // Spalten
}

insertObject();



function getRandomInt(max, n) { // n = Teiler = 2, 3, 5, 7
  return Math.floor(Math.random() * max) * n + n; // +n die Null ausschl.
  console.log(Math.floor(Math.random()));
}

function getlowestfraction(x0) {
    var eps = 1.0E-15;
    var h, h1, h2, k, k1, k2, a, x;

    x = x0;
    a = Math.floor(x);
    h1 = 1;
    k1 = 0;
    h = a;
    k = 1;

    while (x-a > eps*k*k) {
        x = 1/(x-a);
        a = Math.floor(x);
        h2 = h1; h1 = h;
        k2 = k1; k1 = k;
        h = h2 + a*h1;
        k = k2 + a*k1;
    }

    return h + "/" + k;
}
