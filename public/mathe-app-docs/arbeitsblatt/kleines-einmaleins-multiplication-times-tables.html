    <script>
      function createMultiplicationMatrix() {
    let matrix = [];

    // Define the first row and column with numbers from 2 to 9
    // Ensuring they are different from each other
    let firstRowAndColumn = [2, 3, 5, 7];

    // Initialize the matrix with the first row
    for (let i = 0; i < 4; i++) {
        matrix[i] = new Array(4).fill(0);
        matrix[i][0] = firstRowAndColumn[i];
    }

    // Set the avatar at A(0,0)
    matrix[0][0] = 'avatar';

    // Fill the remaining cells with multiplication values
    for (let i = 1; i < 4; i++) {
        for (let j = 1; j < 4; j++) {
            matrix[i][j] = matrix[i][0] * matrix[0][j];
        }
    }

    return matrix;
}

// Example usage
let multiplicationMatrix = createMultiplicationMatrix();
console.log(multiplicationMatrix);
